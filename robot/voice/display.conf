# Display-specific lip-sync defaults. SOURCED by try-lead.sh (and any future
# player). Sink and tuned offset are kept together on purpose.
#
# WHY THE OFFSET IS A DISPLAY PROPERTY, NOT A ROBOT PROPERTY
#   lipsync.py drives the mouth from the clip's audio envelope. --lead makes the
#   mouth wait that many seconds before performing, and the value that aligns it
#   is:
#       lead = (projector's audio buffering) - (the face's own visual latency)
#   The second term is roughly 50-100 ms: the face polls the mouth file at 30 fps,
#   then renders, then waits for scanout. Change the display, the sink, or the
#   frame rate and this number is wrong.
#
# HOW TO RE-TUNE (do NOT do it against continuous speech)
#   ./calibrate-lead.py                 # interactive: bracket, then bisect by ear
#   ./calibrate-lead.py --show          # what is configured, and what it was tuned on
#   ./calibrate-lead.py --trial 0.15    # ONE trial at a value; writes nothing
#
#   Continuous speech is not resolvable by eye - repeated readings contradict each
#   other and you end up hunting inside a ~70 ms band you cannot see into. The tool
#   plays tones/sync-calibration.wav instead: three 180 ms bursts over pure digital
#   silence, so the question becomes "does the mouth pop land on the beep". It asks
#   only which WAY a trial misses, never by how much, and it RAISES THE FACE for the
#   trial - at standby the screen is the word "Standby", so without that there is
#   nothing on screen to judge at all.
#
#   Human sync judgement bottoms out near 10-30 ms. When two adjacent values can no
#   longer be told apart that pair IS the finish, and the tool says so rather than
#   spending another round on a difference nobody can perceive.
#
#   Re-read for EVERY playback: greeter.py and session.py read this file per clip,
#   so a new value is live at the next one - no restart, and no "tuned but not
#   applied".
#
# TUNED:
#   02 Nov 2026 03:03 by calibrate-lead.py, judged by eye on the projected mouth.
#   display judged on: HiTV on card0-DP-1, 1920x1080
#   instrument: tones/sync-calibration.wav sha256 01b9ee3c7e317a9c
#   bisect (value and the direction reported): 0.11 late -> 0.01 late -> -0.19 early -> -0.04 dead on
#   note: dead on
#   previous LEAD: 0.11
SINK=alsa_output.platform-3510000.hda.hdmi-stereo
LEAD=-0.04
