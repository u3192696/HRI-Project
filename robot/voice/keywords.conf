# The listener's vocabulary. Read by listener.py, never sourced (same KEY=VALUE
# format as display.conf and mic.conf).
#
# THE RITUAL
#   Two stages, both spoken, both required:
#     1. "system command reset"     an exact trigger phrase. Arms a countdown.
#     2. "marigold wombat sierra"   the pass phrase, inside CONFIRM_TIMEOUT.
#   Stage 1 alone draws a prompt and starts the clock. Stage 2 alone does nothing
#   and is logged as ORPHAN, because a pass phrase with no command pending means
#   a trigger was missed. Only the pair executes anything.
#
# THE COMMAND SET STAYS CLOSED AND SMALL
#   Six fixed verbs means the recogniser is grammar-constrained end to end: the
#   decoder physically cannot invent a command. So a mishearing is not "the wrong
#   sentence", it is confined to confusing two of five known words, and the
#   confirmation prompt shows which one was parsed. Say "reset", see "Reset", and
#   a confusion is visible before anything happens.
#   Keep it closed. If a command ever needs an argument ("skip to level 3"), the
#   argument is a NUMBER, which is also a small closed set: add numbered trigger
#   phrases rather than opening the vocabulary up.
#
# WHAT MAKES A WORD EASY TO DETECT
#   Measured on this rig, not asserted. From the 1 Nov recordings (Vosk
#   small-en-us, free-form decode of the same mic) and the first live session:
#
#     Danny saying "hello robot"   hello 1.00   robot 0.71  (heard as "robert" 0.54)
#     fragments of quiet speech    here 0.45  is 0.44  was 0.53  a 0.64
#     the robot's own intro clip   median word confidence 1.00
#     first live session           wombat 1.00 and 0.84   marigold 1.00   hello pip 0.75
#
#   1. LENGTH. 2 to 4 syllables. Every syllable is evidence. Monosyllables score
#      badly: "is" 0.44, "was" 0.53, "a" 0.64.
#   2. SONORITY. Vowels, nasals (m, n, ng), liquids (l, r) and glides (w, y) carry
#      the energy and survive distance and room acoustics. Plosives (p, t, k) are
#      brief bursts, and fricatives (s, f, th) are quiet next to a vowel. That is
#      the weak spot in "system" (two /s/) and in "sierra".
#   3. DISTINCTIVENESS. "robot" was misheard as "robert" (0.54) on this mic; "Pip"
#      was decoded as "pit". A word with no common homophone beats a word that is
#      merely easy to say.
#   4. RARITY IN CONVERSATION. This controls false positives. "stop", "yes", "no",
#      "okay" occur constantly.
#   5. NOT IN THE ROBOT'S OWN SCRIPT. The greeter plays a fixed introduction and
#      the microphone shares an enclosure with the speaker. The intro says hello,
#      Pip, robot, look, comfortable, pause, ready, begin and more, but none of the
#      words below. listener.py also suppresses detection while the mouth file is
#      fresh, so this is defence in depth rather than the only defence.
#
# WHY THE TRIGGER PREFIX IS "system command"
#   Both words are common, which is a mark against factor 4. The phrase is distinct
#   as a PAIR, and a detection requires the WHOLE endpoint to equal the phrase, so a
#   stray "system", a stray "command", or the bare verb on its own cannot fire it.
#
# THE PASS PHRASE
#   Seven syllables of rare words, none of them in intro.txt, all of them measured
#   well when spoken live. It is the last gate before an action, so it should stay
#   long: the longer and rarer it is, the less it can be hit by accident.
#
# MEASURED FALSE POSITIVES
#   Both stages were run over three files: the greeter's own intro clip, the 45 s
#   recording of a person speaking near the mic, and 60 s of mostly room floor with
#   transients in it. Result: 0 detections each. That is encouraging, and it is
#   three files, none of which contains a room of people talking about a robot.
#   Read it as "no observed false positive", not "cannot happen".
#
#   An earlier six-word test list ("hey pip", "hello pip", "wombat", "marigold",
#   "kookaburra", "stop") produced two NEAR MISSES on the greeter's own clip:
#   'hello [unk] pip [unk]' at 0.88, and '[unk] [unk] [unk] stop [unk]' at 0.96
#   (the intro says "...or stop at any time"). Neither fired, because a match must
#   cover the whole endpoint and the [unk] padding breaks it. Run alone as a
#   single-phrase grammar, "stop" gave 0 detections on the same clip. So the near
#   miss was a property of a crowded grammar, not of the word, but it is a reason
#   to keep this list short, and it is why a match is never a substring test.
#
# START AND STANDBY, AND WHY THESE ARE THE TWO VERBS WIRED SO FAR
#   "start" is the entry point of a session. The robot powers on showing
#   "Standby"; a confirmed "system command start" swings the session phase to
#   running, which is what puts a face on screen and lets the greeter greet.
#   It is wired first because it is the harmless class of action — nothing powers
#   off, nothing is lost — and because the ritual needs one verb that does
#   something observable before the risky ones are considered.
#
#   Against it, on the criteria above: "start" is a common word (factor 4), and
#   one syllable with an initial fricative and two plosives (factors 1 and 2).
#   What protects it is the PREFIX: a detection requires the whole endpoint
#   "system command start", so a stray "start" in ordinary speech cannot fire it.
#   That is the same argument already accepted for "reboot", and it is not a
#   licence to shorten the prefix.
#
# STANDBY, THE OPERATOR'S RESET
#   A confirmed "system command standby" returns the robot to the state it powers
#   on in, from any state: a stage, a timed session, or the Success screen. It
#   exists so one stage can be tested without sitting through all four, and so a
#   run that has gone wrong can be abandoned without restarting the service.
#
#   Against it, on the criteria below: "standby" is a common word, and two
#   syllables with a cluster in the middle. What protects it is the PREFIX, the
#   same as "start", and one thing more: it is the word the SCREEN already shows
#   for that state. The confirmation prompt displays the parsed command, so an
#   operator who sees "Standby" on the projector and "Standby" on the prompt is
#   looking at the same word twice.
#
#   It is also the one verb that cannot be heard while the robot is talking: the
#   half-duplex gate drops the microphone through every clip, so a `standby` is
#   only ever picked up while the robot is silent — during a stage's wait, during
#   a timed session, or on the Success screen. Nothing therefore needs to
#   interrupt playback to make it work.
#
#   MEASURED with the verb added:
#     * The robot's OWN introduction must not fire the vocabulary. Pointed at
#       robot/voice/clips/rung1-cartoon-intro.wav:
#           .venv/bin/python listener.py --test-file clips/rung1-cartoon-intro.wav
#       it decodes as 12 endpoints and 0 ritual events, so it does not fire. One
#       of those endpoints IS a bare "start" (51.6s, conf 0.87), from the line
#       "you can pause, skip a stage, or stop at any time" — the word the prefix
#       is there to save us from, and a reminder that "start" and "stop" are one
#       weak vowel apart to this recogniser.
#     * A synthesised positive control (Piper, en_GB-alan-medium — the intro
#       voice — "system command start", 1.2s gap, "marigold wombat sierra")
#       decodes at conf 1.00 for both phrases and runs PROMPT 2.38s, EXECUTE
#       5.50s. Give a test WAV trailing silence, or Vosk holds the last phrase
#       back to the end of the stream and the run looks like a timeout.
#       TTS is cleaner than a person: treat this as a floor, not as a substitute
#       for the human positive control.
#
# "SKIP STAGE 2", THE THIRD WAY IN
#   A confirmed "system command skip stage 2" puts rung 2 on screen without walking
#   stage 1, for testing that stage alone and for an operator demonstrating it.
#   Two words rather than a verb and an argument, so the closed-grammar property
#   survives: "system command skip" alone is still its own (unwired) verb, and the
#   numbered phrase is the one that acts.
#
#   Stage 2 has TWO introductions, and which one plays is decided by how the stage
#   was reached, not by the operator saying so: after a finished stage 1 the robot
#   congratulates and picks up from Pip; after a jump it introduces itself from
#   cold. The conductor records that (session.py's Session.entry) and the listener
#   only publishes the phrase. See robot/voice/stage2_intro.txt and stage2_skip.txt.
#
# THE TWO COMMANDS THAT CAN HURT
#   "shutdown" and "reboot" power off or restart the board this process runs on.
#   Wiring those to an action should be the LAST step: after the confirmation gate
#   has been shown working on the harmless commands, and after the pass phrase has
#   been measured on real speech rather than on three files.

# DECISIONS SETTLED (1 Nov 2026, on the measurements above)
#   Recorded so they are not re-litigated without new data. Each one is a choice
#   to accept a specific, MEASURED cost.
#
#   1. "reboot" KEEPS its name. A person saying "robot" emits 'reboot' at 1.00
#      confidence, four independent instances. "system command robot" is not
#      something anyone says by accident, so the prefix is accepted as the
#      protection. Do not add a tolerant rule to "fix" this.
#   2. A trigger phrase is matched STRICTLY: the whole endpoint, with no [unk]
#      tolerance at the edges. A breath before "system command reset" cost one
#      detection in the test session, and that is the accepted price of never
#      acting on something unclearly enounced. Do not relax Vocab.classify.
#   3. CONFIRM_TIMEOUT stays 5.0. Measured confirmation latency was 3.6-4.1 s,
#      which is close to the window, but 5 s is judged plenty of time to speak
#      the phrase. If a real session starts logging TIMEOUT, revisit it with that
#      session's numbers rather than assuming a number is too small.
#   4. A trigger and a pass phrase in ONE breath is a MISS, deliberately. The
#      decoder merges them into a single endpoint ('system command skip marigold
#      wombat sierra') which matches nothing. The two stages stay separate; the
#      face drawing a prompt is what teaches the pause between them.
#
# The trigger is this prefix plus a command, matched as one whole utterance.
TRIGGER_PREFIX=system command

# Semicolon-separated. Each one becomes "<prefix> <command>".
# WIRED: start, standby and "skip stage two" all act (see listener.py's WHAT A
# CONFIRMED COMMAND DOES). The rest are still recognised and confirmed, and log
# WOULD EXECUTE. A multi-word command is deliberate: the whole phrase is the
# vocabulary entry, so the grammar stays closed and `skip` never has a free-text
# argument ("add numbered trigger phrases rather than opening the vocabulary up").
#
# The stage number is SPELLED OUT, and that is not style. This model's vocabulary
# has no digit tokens: written "skip stage 2" the decoder logs
#   WARNING: Ignoring word missing in vocabulary: '2'
# and silently drops it, so the phrase it listens for is not the phrase anyone
# said. Measured 3 Nov 2026 through --test-file. An operator still says "skip
# stage two", so nothing changes in the room - only in this file.
COMMANDS=start;standby;skip stage two;reset;skip;shutdown;reboot;debug

# Spoken inside CONFIRM_TIMEOUT to confirm. Order and spelling matter: it is
# matched as one whole phrase, not as three independent words.
PASS_PHRASE=marigold wombat sierra

# How long the prompt stays open. "marigold wombat sierra" takes about 2 s to say,
# so 5 s is generous, but start counting when the prompt has finished drawing
# rather than when the trigger fired, or a slow render eats the window.
CONFIRM_TIMEOUT=5.0

# Vosk model. NOT in git: 68 MB unpacked. Keep it on the device and re-fetch with
# ./fetch-model.sh if the board is reimaged. The lab has no network, so this file
# must already be here before you leave home.
MODEL=/home/jetson/robot/voice/models/vosk-model-small-en-us-0.15

# Where events are appended. This is the whole interface while no monitor or
# projector is connected: it is how a trigger, a prompt, a confirmation and a
# timeout are told apart without seeing the face.
LOG=/tmp/voice-detection.log

# Half-duplex gate. lipsync.py rewrites the face's mouth file ~60x a second while
# a clip is playing, so a fresh mtime means the robot is talking and everything the
# microphone hears is the robot itself. Detections are suppressed while it is
# fresh, and the recogniser is reset so the robot's own speech leaves nothing
# half-decoded in the buffer. This is what stops Pip commanding Pip.
MOUTH=/run/face/mouth.json
MOUTH_STALE=0.3

# THE PARTICIPANT'S STAGE WORD, AND WHAT PROTECTS A BARE WORD
#   The person doing the gaze exercise starts each stage by saying ONE word. No
#   prefix, no pass phrase, no confirmation: they are a participant rather than an
#   operator, and the admin ritual exists for verbs that can hurt the board. So
#   this word has to be safe WITHOUT a phrase around it, and that changes what
#   "safe" means:
#     * UNUSUAL in ordinary speech, so the room's conversation will not produce it;
#     * ALL-SONORANT, with long vowels and no plosives or fricatives, because
#       fricatives are the first thing to go with distance and this rig's mic is a
#       mono dongle two metres away;
#     * absent from the robot's own script, so the robot cannot say it;
#     * not confusable with any other word in this file.
#   A false positive costs one stage starting sixty seconds early, which is the
#   harmless direction, and the half-duplex gate covers the robot's own voice.
#
#   MEASURED, with five candidates synthesised in the intro voice (Piper,
#   en_GB-alan-medium) and run through the real grammar via --test-file:
#     moonlight, sunflower, pineapple, candlelight, watermelon
#   ALL FIVE fired as whole-endpoint matches at confidence 1.00. TTS does not
#   discriminate between candidates, so the choice above is the argument, not the
#   measurement; the instrument that decides is a person at two metres.
#
#   What the measurement DOES establish:
#     * the word inside a sentence does not fire. "I saw the moonlight last night"
#       came through as [unk], 0 events, because the whole endpoint must match.
#     * the robot's own introduction still produces 12 endpoints and 0 events with
#       the word in the grammar.
#
#   A SECOND WORD, "let's begin", and the cost plainly accepted (3 Nov 2026)
#   The stage introductions TELL the participant "when you're ready, just say
#   'Let's Begin'", because that is the sentence the script ends on. A script that
#   asks for a word the robot cannot hear is a lie told to a participant, so the
#   phrase is accepted rather than the script rewritten around the measurement.
#   It breaks factor 5 above - it IS in the robot's own script, twice - and it is
#   common English, which factor 4 also marks against. What still protects it:
#     * the whole endpoint must match, so the bare word "begin" inside a sentence
#       is a PARTIAL and fires nothing. The intro says "...begin" only at the end of
#       "just say 'Let's Begin'", and what saves it is the [unk] in front, NOT a
#       comfortable margin of words around it (see the measurement below);
#     * the half-duplex gate drops the microphone through every clip, so the robot
#       saying its own script cannot be heard by itself;
#     * a false positive costs a stage starting sixty seconds early - the harmless
#       direction - and `standby` is always one confirmed phrase away.
#   MEASURED on the rig, four times, because the answer CHANGED with the voice.
#   Through the real grammar via --test-file:
#     old voice (Piper), 3 Nov:
#       clips/rung1-cartoon-intro.wav  12 endpoints, 0 events ('[unk] [unk] [unk] begin')
#         (the pre-4-November clip, which ended 'shall we begin?')
#       clips/stage2-intro.wav          8 endpoints, 0 events ('[unk] [unk] lets begin')
#       clips/stage2-skip.wav          11 endpoints, 0 events ('[unk] [unk] lets begin')
#     first Breeze voice, 4 Nov:
#       clips/stage2-intro.wav          9 endpoints, **1 EVENT** (endpoint: 'lets begin')
#       clips/stage2-skip.wav          13 endpoints, 0 events ('[unk] x4 lets begin')
#     neutral register (the shipped voice), 4 Nov:
#       clips/stage2-intro.wav          8 endpoints, 0 events ('[unk] x3 lets begin' 0.98)
#       clips/stage2-skip.wav          12 endpoints, 0 events ('[unk] [unk] lets begin' 1.00)
#       clips/rung1-cartoon-intro.wav  13 endpoints, 0 events ('[unk] lets begin' 1.00)
#         (Pip re-rendered 4 Nov so it ends on the same sentence; the ONE [unk] before
#          'lets begin' is the whole margin, and it is one word deep, not a sentence.
#          That makes stage 1's clip the WEAKEST of the three, and the one to
#          re-measure first after any change to the greeting.)
#   That middle row is the warning: a CLEARER voice made "just say" decode away, so
#   the intro clip's last two words became the whole endpoint and the dry run fired.
#   The neutral register degrades it again and both clips are back to 0 events. No
#   wording was changed to get there - the voice moved and the endpoint moved with
#   it. Re-measure after EVERY render; never carry this result forward.
#   Even so, the gate is not defence in depth for that clip: --test-file feeds the
#   decoder with no half-duplex gate, and in the live path the gate is shut for the
#   entire clip AND the recogniser is Reset() on every suppressed block, so the
#   phrase cannot complete - by design, not by luck. Before rewording that sentence,
#   or running the listener with --no-half-duplex, know that the robot would start
#   its own stage 2. Putting any word AFTER "Let's Begin" ("...and we'll start")
#   removes the risk entirely, because the endpoint would no longer equal the phrase.
#   The positive control (Piper speaking "system command skip stage two", 1.2 s
#   gap, "marigold wombat sierra") decodes at conf 1.00 for both phrases and runs
#   PROMPT 3.12s, EXECUTE 6.25s, so the phrase itself is recognisable when a person
#   means it.
#
#   Semicolon-separated. "let's begin" is written with an apostrophe because that
#   is how a person would write it; listener.py drops apostrophes on BOTH sides
#   before matching, because Vosk's lexicon emits 'lets' and a grammar string with
#   punctuation is not a word sequence at all. Do not "tidy" the spelling here.
WORD_TRIGGER=moonlight; let's begin

# The command outbox. WRITTEN by a confirmed admin verb (currently `start`), read
# by the session conductor (session.py), which is the only writer of the session
# file the face and the greeter read. Carries a monotonic sequence number so the
# reader can tell a new event from the same one re-read.
COMMAND=/run/face/command.json

# The confirmation currently on screen, with the monotonic deadline of its
# countdown, so the face can draw the window a person is meant to beat. Deleted
# when the window closes, which is why absence is the ordinary state.
PROMPT=/run/face/prompt.json

# Whether the robot can HEAR right now, for the green "Listening" pill the face
# draws. Re-stamped on a heartbeat rather than only on transitions, because the
# pill must go out when the listener DIES: a stopped service, a dead arecord and a
# SIGKILL all leave their last state on disk, and only a stamp that stops moving
# can tell any of them apart from a quiet room. `listening` means "say something and
# you will be heard"; while the robot is speaking the file says `speaking` instead,
# because the half-duplex gate means the microphone is open and nothing gets
# through, and a green light at that moment would invite someone to talk into it.
MIC_STATE=/run/face/mic.json

# After a trigger, how many seconds of hearing NOTHING before the same trigger can
# arm again. Too short and one utterance arms twice; too long and a second attempt
# in the same breath is swallowed.
HOLDOFF=2.0

# Minimum mean word confidence before a recognition counts as a detection.
MIN_CONF=0.5
