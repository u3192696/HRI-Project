# The capture device. Read by mic.py, never sourced (format matches display.conf:
# a shell fragment of KEY=VALUE lines, so the two files stay legible side by side).
#
# WHY THE MICROPHONE IS PINNED BY NAME, NOT LEFT TO THE DEFAULT SOURCE
#   The default PulseAudio source on this board is NOT a microphone. It is
#   alsa_input.platform-sound.analog-stereo, which maps to card 1 (tegra-ape)
#   whose PCMs are internal DMA fabric (tegra-dlink-N XBAR-ADMAIFN). It opens, it
#   reports success, and it records EXACT digital zeros - all 144000 samples
#   0.000000, measured 1 November 2026. There is no error, no warning and no way
#   to tell from the API that it is not a microphone.
#
#   So anything that records @DEFAULT_SOURCE@ "works" and hears nothing. For a
#   listener that is the worst possible failure: silence is indistinguishable
#   from nobody speaking. The capture device is therefore named explicitly here,
#   for the same reason display.conf names the sink - and mic.py REFUSES to fall
#   back to the default rather than quietly recording the wrong device.
#
# VERIFIED 1 November 2026 (Orin, L4T R36.5.2)
#   device   1100:30a2 VirTouch MK-02P, a USB audio dongle
#   card     card 2 [MK02P], "MK-02P at usb-3610000.usb-2.4, high speed"
#   channels MONO - the capsule is duplicated into L and R bit-for-bit, so
#            recording -c 2 costs double and gains nothing
#   rates    48000 / 96000 / 192000, S16_LE and S24_3LE
#   control  one mixer control, capture at 88% (+5.00 dB), not muted
#   measured quiet room   median -56.5 dBFS, 5th percentile -61.3 dBFS
#   measured speech peak  -32.1 dBFS; a 1.88 s sustained vowel held F0 with
#                         correlation 0.85 across 174 of 176 frames
#   Self-triggering is the thing to watch: speaker and mic share an enclosure.
#
# IF THE MICROPHONE IS REPLACED, RE-DERIVE THIS LINE - DO NOT GUESS IT
#   The name is <kind>.<vendor>_<product>_<serial or blank>.analog-stereo, so it
#   carries the device's serial number and changes with the hardware. Read it
#   off the board rather than editing it from memory:
#
#     export XDG_RUNTIME_DIR=/run/user/1000
#     pactl list short sources                       # the name to copy
#     arecord -l                                     # must show a card of its
#                                                    # OWN, not tegra-dlink-N
#     PULSE_SOURCE=<name> arecord -D pulse -d 3 -f S16_LE -r 48000 -c 1 /tmp/x.wav
#     sox /tmp/x.wav -n stat                         # amplitude must NOT be 0.000000
#
#   A capture device of its own card, with a non-zero noise floor, is the bar.
#   "It opened" is not evidence; the fabric source opens too.
SOURCE=alsa_input.usb-MK-02P_MK-02P_AP5980_20220308-00.analog-stereo

# Capture format for anything that listens. Mono because the mic is mono.
RATE=48000
CHANNELS=1
