# weston-kiosk.ini — kiosk compositor config for the social robot face
#
# Installed at /home/jetson/.config/weston-kiosk.ini and passed explicitly to
# weston via --config, so it does NOT disturb /etc/xdg/weston/weston.ini (which
# contains NVIDIA's ivi-shell settings for this image).
#
# Purpose: drive the DisplayPort output, pin the mode, and give the face app a
# shell with no panel, no background image, and no window chrome.

[core]
# Never blank the screen — the face must stay visible.
idle-time=0
# The DRM backend needs to own a VT.
tty=1

[output]
name=DP-1
# mode is a list: width x height @ refresh. 1920x1080@60 is the display's
# native mode as reported by EDID; if the projector reports something else,
# weston picks the closest available and logs it.
mode=1920x1080@60
# Face the right way up.
transform=normal
scale=1

[shell]
# desktop-shell draws a panel and a background by default — kill both so the
# face app is the only thing on screen.
panel-position=none
background-color=0xff0d0b14
# No lock screen, no fade, no cursor after idle (there is no pointing device).
locking=false
# Start the face app's window fullscreen rather than as a floating window.
binding-modifier=none
animation=none

[libinput]
# The robot has no keyboard or mouse. Ignore any that appear so a stray USB
# device cannot steal focus from the face.
enable-tap=true

[screensaver]
# Disabled entirely — a social robot that stops making eye contact looks broken.
