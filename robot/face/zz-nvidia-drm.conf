# /etc/modules-load.d/zz-nvidia-drm.conf
#
# Load the NVIDIA display driver late in the boot sequence.
#
# WHY THIS FILE EXISTS
#   On this L4T image (R36.5.2 / JetPack 6.2.3) nothing loads nvidia-drm at
#   boot. The vendor file /etc/modules-load.d/nv.conf ships nvmap, nvgpu,
#   pwm-fan, ina3221 and nvidia-p2p — but NOT nvidia-drm. Nothing in
#   /etc/modules, and no systemd unit, pulls it in either.
#
#   Without nvidia-drm there is no DRM card carrying DP-1, no DRM master — so no
#   Wayland compositor can start, and the kiosk fails with
#   "weston exited before creating a socket".
#
#   A stock desktop install never notices: gdm drags the NVIDIA stack in
#   incidentally, late, at graphical.target. This robot runs multi-user.target
#   with no display manager, so the dependency has to be declared explicitly.
#
# THE NAME IS THE POINT — DO NOT "TIDY" IT TO 60-nvidia-drm.conf
#   systemd-modules-load reads every module list in /etc/modules-load.d,
#   /run/modules-load.d and /usr/lib/modules-load.d and *merges them sorted
#   lexicographically by filename*, then loads the modules in that order.
#
#   An earlier version of this file was called "60-nvidia-drm.conf". That sorts
#   BEFORE the vendor "nv.conf", so nvidia_drm was loaded first — before nvgpu
#   and nvmap existed. The kernel then initialises the NVIDIA display driver
#   against a GPU stack whose buffer allocator is not up yet:
#
#     [drm] Initialized nvidia-drm ... on minor 0      <- too early
#     fb0: switching to nvidia-drm from simple
#     nvmap_page_pool_init: ... 243433 pages (950 MB)  <- nvmap heap, only now
#     nvgpu: 17000000.gpu  ... syncpt_unit_base ...    <- nvgpu, only now
#
#   That ordering is NOT fatal at load time, so the mistake is invisible in the
#   boot log — but it breaks EGL permanently. Every compositor start then dies
#   with:
#
#     failed to initialize display
#     EGL error state: EGL_NOT_INITIALIZED (0x3001)
#
#   which is what weston's GL renderer reports. Loading nvidia_drm manually on a
#   booted system (i.e. after nvmap/nvgpu are up) initialises EGL happily — that
#   is the test that isolates the cause.
#
#   So this file deliberately sorts LAST ("zz-"), after every vendor list. Keep
#   it that way. Anything named "zzz*.conf" in /usr/lib/modules-load.d would
#   still win, but the vendor ships nothing like that.
#
# MODULE NAMES USE UNDERSCORES
#   These are passed to modprobe, which normalises dashes to underscores, so
#   "nvidia-drm" would also work here. (Note that as a *systemd unit instance*
#   the dash form is a trap: modprobe@nvidia-drm.service unescapes to
#   "nvidia/drm" and silently loads nothing, because its ExecStart is prefixed
#   with "-". That cost a debugging session — use underscores or this file.)
#
# nvidia_modeset must be loaded before nvidia_drm. modprobe resolves the
# dependency anyway, but listing them in order makes the intent obvious.
#
# Options (modeset=1 fbdev=1) come from /etc/modprobe.d/nvidia-display.conf,
# so no options are needed here.

nvidia_modeset
nvidia_drm
