# /run/face — the robot's shared state directory. Install to /etc/tmpfiles.d/.
#
# WHY NOT RuntimeDirectory
#   `RuntimeDirectory=face` on a unit looks like the natural way to create
#   /run/face, and it was used originally. The problem is that it binds the
#   directory's LIFETIME to that one unit: systemd removes the directory when
#   the unit stops. Two units sharing the path therefore fight — whichever stops
#   first deletes it out from under the other.
#
#   That is not theoretical. gaze.service and face-kiosk.service both write into
#   /run/face. When face-kiosk went down (a missing executable bit), /run/face
#   disappeared, and because /run is root-owned the unprivileged `jetson` user
#   could not recreate it. gaze then failed with:
#
#       PermissionError: [Errno 13] Permission denied: '/run/face'
#
#   and hit its start-rate limit, leaving the robot with no eyes AND no face
#   from a single unrelated file-mode problem.
#
#   Declaring the directory here decouples it from any service's lifetime: it
#   exists from early boot (systemd-tmpfiles-setup) regardless of what is
#   running, and `systemctl stop` on anything does not remove it.
#
# MODE 0775 and group jetson
#   The services run as `jetson:jetson`, and everything that writes here is that
#   user or root. 0775 group-writable rather than 0755 so a future helper in the
#   jetson group can also write without needing to be the owner — the same
#   reasoning as the old RuntimeDirectoryMode=0775, kept so behaviour is
#   unchanged for the services. `z` (not `d`) applies these attributes even if
#   the directory already exists, so a reinstall fixes a mis-owned directory
#   rather than silently leaving it wrong.
d /run/face 0775 jetson jetson -
z /run/face 0775 jetson jetson -
